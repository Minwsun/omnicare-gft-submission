services:
  web:
    build: ./apps/web
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnicare}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports: ["3000:3000"]
    depends_on: [ai-service]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnicare}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-omnicare}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-cx/gpt-5.4-mini}
      LLM_FAST_REASONING_EFFORT: ${LLM_FAST_REASONING_EFFORT:-low}
      LLM_REASONING_MODEL: ${LLM_REASONING_MODEL:-cx/gpt-5.6-terra}
      LLM_REASONING_PROFILE_EFFORT: ${LLM_REASONING_PROFILE_EFFORT:-medium}
      LLM_REVIEWER_MODEL: ${LLM_REVIEWER_MODEL:-cx/gpt-5.6-terra}
      LLM_REVIEWER_REASONING_EFFORT: ${LLM_REVIEWER_REASONING_EFFORT:-medium}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://apac.api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ChatAgent}
      HARNESS_VERSION: ${HARNESS_VERSION:-v3}
      HARNESS_V3_ENABLED: ${HARNESS_V3_ENABLED:-true}
      LANGCHAIN_AGENT_ENABLED: ${LANGCHAIN_AGENT_ENABLED:-true}
      GRAPHRAG_WORKER_ENABLED: ${GRAPHRAG_WORKER_ENABLED:-true}
      GRAPHRAG_WORKER_CONCURRENCY: ${GRAPHRAG_WORKER_CONCURRENCY:-4}
      GRAPHRAG_POLL_SECONDS: ${GRAPHRAG_POLL_SECONDS:-2}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
